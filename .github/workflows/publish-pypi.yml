name: Publish to PyPI

# Releases run the full CI gate before building.
# Token: GitHub Environment "pypi", secret "PYPI_TOKEN".

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "0.6.14"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: uv sync --all-extras --dev

      - name: CI gate (make check-ci; docker E2E is local-only)
        env:
          RUN_DOCKER_E2E: ""
        run: make check-ci

      - name: Build
        run: uv build

      - name: Publish unplug-ai
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uv publish --check-url https://pypi.org/pypi/unplug-ai/json
